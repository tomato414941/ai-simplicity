<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10110f" />
    <meta
      name="description"
      content="整理せず、そのまま話し続けられるAIとの会話。"
    />
    <title>AI</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <main class="conversation-shell">
      <section
        id="messages"
        class="messages"
        aria-label="会話"
        aria-live="polite"
      >
        <div id="reply-status" class="reply-status" role="status" hidden>
          <span id="status-indicator" class="thinking" aria-hidden="true"><span></span><span></span><span></span></span>
          <span id="status-text"></span>
          <button id="status-action" type="button" hidden></button>
        </div>
      </section>

      <form id="composer" class="composer">
        <label class="visually-hidden" for="message-input">メッセージ</label>
        <textarea
          id="message-input"
          name="message"
          rows="1"
          maxlength="20000"
          placeholder="話す"
          autocomplete="off"
          required
        ></textarea>
        <button type="submit" aria-label="送る">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h13m-5-5 5 5-5 5" />
          </svg>
        </button>
      </form>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
